name: DevSecOps Pipeline

on:
  push:
    branches: [ feat/*, fix/*, dev ]
    paths-ignore:
      # - '.github/workflows/**'
      - '**/README.md'
  pull_request:
    branches: [ main, dev ]
    paths-ignore:
      # - '.github/workflows/**'
      - '**/README.md'

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    if: >-
      github.actor != 'github-actions[bot]' &&
      !startsWith(github.event.head_commit.message, 'doc:') &&
      !startsWith(github.event.head_commit.message, 'style:') &&
      !startsWith(github.event.head_commit.message, 'ci:') &&
      !startsWith(github.event.head_commit.message, 'refactor:')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  sca:
    name: Software Composition Analysis
    runs-on: ubuntu-latest
    if: >-
      github.actor != 'github-actions[bot]' &&
      !startsWith(github.event.head_commit.message, 'doc:') &&
      !startsWith(github.event.head_commit.message, 'style:') &&
      !startsWith(github.event.head_commit.message, 'ci:') &&
      !startsWith(github.event.head_commit.message, 'refactor:')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --json | tee npm-audit-report.json | jq -e 'select(.metadata.vulnerabilities.critical == 0 and .metadata.vulnerabilities.high == 0 and .metadata.vulnerabilities.moderate == 0)' > /dev/null
        
      - name: Upload SCA Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-reports
          path: npm-audit-report.json
      
      - name: Download SCA Reports
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: sca-reports
          path: downloaded-artifacts
      
      - name: Slack Notification with Artifact
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          SLACK_COLOR: ${{ job.status }}
          SLACK_CHANNEL: github
          SLACK_MESSAGE_ON_SUCCESS: "NPM Scan DevSecOps Report is available here: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SLACK_MESSAGE_ON_FAILURE: "NPM Scan DevSecOps Report is available here: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SLACK_MSG_AUTHOR: ${{ github.actor }}
          MSG_MINIMAL: true

  sast:
    name: semgrep/ci
    runs-on: ubuntu-latest
    if: >-
      github.actor != 'github-actions[bot]' &&
      !startsWith(github.event.head_commit.message, 'doc:') &&
      !startsWith(github.event.head_commit.message, 'style:') &&
      !startsWith(github.event.head_commit.message, 'ci:') &&
      !startsWith(github.event.head_commit.message, 'refactor:')
    permissions:
      contents: read
    container:
      image: semgrep/semgrep
    steps:
    - uses: actions/checkout@v4

    - name: Run semgrep
      run: semgrep scan --error --json-output=semgrep-results.json
      env:
        SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

    - name: Upload Semgrep Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: semgrep-report
        path: semgrep-results.json

    - name: Download Semgrep Report
      if: always()
      uses: actions/download-artifact@v4
      with:
        name: semgrep-report
        path: downloaded-artifacts/

    - name: Slack Notification with Artifact
      if: always()
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_COLOR: ${{ job.status }}
        SLACK_FILE_UPLOAD: "downloaded-artifacts/semgrep-results.json"
        SLACK_MESSAGE_ON_SUCCESS: "Semgrep Scan DevSecOps Report"
        SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
        SLACK_CHANNEL: github

    - name: Slack Notification
      if: ${{ failure() }}
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_COLOR: ${{ job.status }}
        SLACK_MESSAGE_ON_FAILURE: "DevSecOps Pipeline failed!"

    - name: Slack Notification
      if: ${{ success() }}
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_COLOR: ${{ job.status }}
        SLACK_MESSAGE_ON_SUCCESS: "DevSecOps Pipeline was successful!"
        
